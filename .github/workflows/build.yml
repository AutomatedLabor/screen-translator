name: Build, Sign and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Prevent two concurrent release builds from racing (Council P0-2).
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper jar
        uses: gradle/wrapper-validation-action@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 platforms;android-31'

      - name: Put build-tools (apksigner, aapt) on PATH
        run: |
          set -euo pipefail
          BT="$(ls -d "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/build-tools/"* | sort -V | tail -1)"
          echo "build-tools dir: $BT"
          echo "$BT" >> "$GITHUB_PATH"

      - name: "Decode release keystore (fail-closed)"
        env:
          TRANSLATOR_KEYSTORE_BASE64: ${{ secrets.TRANSLATOR_KEYSTORE_BASE64 }}
          TRANSLATOR_KEYSTORE_PASSWORD: ${{ secrets.TRANSLATOR_KEYSTORE_PASSWORD }}
          TRANSLATOR_KEY_ALIAS: ${{ secrets.TRANSLATOR_KEY_ALIAS }}
          TRANSLATOR_KEY_PASSWORD: ${{ secrets.TRANSLATOR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TRANSLATOR_KEYSTORE_BASE64:-}" ]; then
            echo "::error::TRANSLATOR_KEYSTORE_BASE64 secret is not set; refusing to build an unsigned or wrongly-signed release APK."
            exit 1
          fi
          if [ -z "${TRANSLATOR_KEYSTORE_PASSWORD:-}" ] || [ -z "${TRANSLATOR_KEY_ALIAS:-}" ] || [ -z "${TRANSLATOR_KEY_PASSWORD:-}" ]; then
            echo "::error::One or more keystore secrets are empty; aborting."
            exit 1
          fi
          # The .jks binary lives in RUNNER_TEMP (never inside the repo tree, so no
          # wildcard upload-artifact or git add can leak it). keystore.properties
          # (gitignored) lives at the repo root so Gradle's rootProject.file() finds it.
          echo "${TRANSLATOR_KEYSTORE_BASE64}" | base64 -d > "$RUNNER_TEMP/translator-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/translator-release.jks"
            echo "storePassword=$TRANSLATOR_KEYSTORE_PASSWORD"
            echo "keyAlias=$TRANSLATOR_KEY_ALIAS"
            echo "keyPassword=$TRANSLATOR_KEY_PASSWORD"
          } > "$GITHUB_WORKSPACE/keystore.properties"
          echo "keystore staged (jks in RUNNER_TEMP, properties at repo root)."
          # Smoke-check: keystore + password + alias are consistent (keytool exits 0).
          # NOTE: do NOT grep keytool's stdout for verbose fields — `keytool -list`
          # (without -v) prints a one-line summary that lacks "Alias name"/"Owner"/
          # "Entry type"; a grep for those would always fail. Rely on the exit code.
          keytool -list -keystore "$RUNNER_TEMP/translator-release.jks" \
            -storepass "$TRANSLATOR_KEYSTORE_PASSWORD" -alias "$TRANSLATOR_KEY_ALIAS" >/dev/null 2>&1 \
            || { echo "::error::keystore/password/alias mismatch — check TRANSLATOR_KEYSTORE_* secrets"; exit 1; }
          echo "keystore smoke-check passed (alias readable with supplied password)."

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: "Verify release APK signing (fail-closed)"
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          echo "=== apksigner location ==="
          command -v apksigner
          echo "=== apksigner verify --print-certs --verbose ==="
          apksigner verify --print-certs --verbose "$APK" | tee apksigner-verify.txt
          echo "=== assertions (P0-1: release DN + cert SHA-256 pinned; P0-3: v3 required; debug key rejected) ==="
          grep -q "^Verifies$" apksigner-verify.txt || { echo "::error::apksigner did NOT report 'Verifies'"; exit 1; }
          # Scheme: AGP 8.5.2 emits v3-only for minSdk >= 24 (v1/v2 flags are accepted but do
          # not change the output — verified empirically). v3 is supported on Android 7+, so
          # the APK installs on every target device (minSdk 31). REQUIRE v3=true.
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" apksigner-verify.txt || { echo "::error::v3 scheme NOT verified"; exit 1; }
          # v1/v2 disposition is informational (do not fail). v1=false means `keytool -printcert`
          # gives a false "Not a signed jar file" — users must inspect with apksigner instead.
          grep -q "Verified using v1 scheme (JAR signing): true" apksigner-verify.txt && echo "v1=true (keytool will also report the signer)" || echo "v1=false (inspect with apksigner, NOT keytool)"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apksigner-verify.txt && echo "v2=true" || echo "v2=false"
          grep -q "CN=Screen Translator Release" apksigner-verify.txt || { echo "::error::cert DN does NOT contain 'CN=Screen Translator Release'"; exit 1; }
          if grep -q "CN=Android Debug" apksigner-verify.txt; then echo "::error::cert is the public Android Debug key — rejected"; exit 1; fi
          # P0-1: cert SHA-256 baseline — detects key rotation even if the DN is unchanged.
          # Parse robustly: apksigner 37.x prints "V3.0 Signer: certificate SHA-256 digest: <hex>";
          # older apksigner prints "Signer #1 certificate SHA-256 digest: <hex>". Match either.
          EXPECTED_CERT_SHA256="a0b5e5f35ee134d2816a24cc467297b3024ea466f1d5d98c0104b3e8b7e27fa2"
          ACTUAL_CERT_SHA256="$(grep -E 'certificate SHA-256 digest:' apksigner-verify.txt | sed -E 's/.*certificate SHA-256 digest: ([a-f0-9]+).*/\1/' | head -1)"
          echo "expected cert SHA-256: $EXPECTED_CERT_SHA256"
          echo "actual   cert SHA-256: $ACTUAL_CERT_SHA256"
          [ -n "$ACTUAL_CERT_SHA256" ] || { echo "::error::could not parse cert SHA-256 from apksigner output"; exit 1; }
          [ "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256" ] || { echo "::error::cert SHA-256 mismatch — possible KEY ROTATION (expected $EXPECTED_CERT_SHA256, got $ACTUAL_CERT_SHA256)"; exit 1; }
          echo "::notice::Release APK signing verified: Verifies, v3=true, DN=CN=Screen Translator Release, cert SHA-256 matches pinned baseline."

      - name: "Generate SHA-256 sidecar and stage release assets"
        run: |
          set -euo pipefail
          REL="app/build/outputs/apk/release"
          DBG="app/build/outputs/apk/debug"
          ( cd "$REL" && sha256sum app-release.apk > app-release.apk.sha256 )
          echo "=== APK SHA-256 ==="
          cat "$REL/app-release.apk.sha256"
          cp "$REL/app-release.apk"        "$GITHUB_WORKSPACE/screen-translator-v1.1.0-release.apk"
          cp "$REL/app-release.apk.sha256" "$GITHUB_WORKSPACE/screen-translator-v1.1.0-release.apk.sha256"
          cp "$DBG/app-debug.apk"          "$GITHUB_WORKSPACE/screen-translator-v1.1.0-debug.apk"
          echo "=== aapt dump badging ==="
          aapt dump badging "$GITHUB_WORKSPACE/screen-translator-v1.1.0-release.apk" | head -25 | tee badging.txt

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: screen-translator-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
            apksigner-verify.txt
            badging.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: screen-translator-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: Screen Translator v1.1.0 (signed release)
          files: |
            screen-translator-v1.1.0-release.apk
            screen-translator-v1.1.0-release.apk.sha256
            screen-translator-v1.1.0-debug.apk
            apksigner-verify.txt
            badging.txt
          body: |
            # Screen Translator v1.1.0 — Android APK (dedicated release key)

            Built from commit `${{ github.sha }}`.

            ## What changed vs v1.0.x

            - **Dedicated release signing key.** v1.0.0 / v1.0.1 were signed with the
              throwaway debug keystore (a different key on every CI run, and the public
              Android debug key) — which made in-place updates impossible and is the
              classic "no certificates / install failed" trap. v1.1.0 is signed with a
              dedicated `CN=Screen Translator Release, O=AutomatedLabor` key (v3 scheme,
              supported on Android 7+; our minSdk is 31), consistent across every build.
            - **v3-signed (modern Android standard).** AGP 8.5.2 signs the release with
              the v3 scheme, supported on Android 7+ — every target device (minSdk 31)
              installs it. v1/v2 are NOT produced. **Inspect with `apksigner verify`, NOT
              `keytool -printcert`** (keytool is v1-only and reports a false "Not a signed
              jar file" for v3-only APKs — see `apksigner-verify.txt` in this release for
              proof of valid signing). (build-learnings headline #16.)
            - **CI is fail-closed on signing.** If `TRANSLATOR_KEYSTORE_BASE64` is
              missing the workflow aborts (no unsigned APK can ship). An `apksigner
              verify` step requires `Verifies` + v3=true + DN contains
              `CN=Screen Translator Release` + cert SHA-256 matches the pinned baseline
              (rotation detection) and explicitly rejects the debug key.
            - versionCode 1 → 2, versionName 1.0.0 → 1.1.0.

            ## Files

            - **`screen-translator-v1.1.0-release.apk`** — signed release (~110 MB).
            - **`screen-translator-v1.1.0-release.apk.sha256`** — SHA-256 sidecar.
            - **`screen-translator-v1.1.0-debug.apk`** — debug variant (~127 MB).
            - **`apksigner-verify.txt`** — proof of signing verification.
            - **`badging.txt`** — `aapt dump badging` (versionCode/Name, launchable activity).

            ## Install

            1. **If you have v1.0.0 or v1.0.1 installed, uninstall it first**
               (Settings → Apps → Screen Translator → Uninstall). The signing key
               changed, so Android intentionally rejects an in-place update.
            2. Download `screen-translator-v1.1.0-release.apk` to your phone.
            3. Tap to install. Accept **"Unknown sources"** for the file manager / browser.
            4. **Android 13+ sideload extra step:** long-press the app icon → App Info →
               three-dot menu → **"Allow restricted settings"**. This unblocks the
               accessibility permission Android 13 hides for sideloaded APKs.
            5. Open **Settings → Accessibility → Screen Translator → enable**.
            6. Open the app → tap **Download model** (German → English, ~30 MB on-device).
            7. Pull down the Quick Settings shade twice → edit → drag the
               **"Translate Screen"** tile into the active row.
            8. Open any German app → tap the tile → German text is overlaid with English.
               Tap **X** (top-right) or scroll / switch apps to dismiss.

            ## How to verify the APK is signed (if you want to check)

            Use **`apksigner`**, NOT `keytool -printcert` (keytool is v1-only and reports
            a false "Not a signed jar file" for this v3-only APK — see `apksigner-verify.txt`
            for proof of valid signing):

            ```
            apksigner verify --print-certs --verbose screen-translator-v1.1.0-release.apk
            # expect: Verifies, v3=true,
            #         Signer #1 certificate DN: CN=Screen Translator Release, O=AutomatedLabor, C=US
            #         Signer #1 certificate SHA-256 digest: a0b5e5f35ee134d2816a24cc467297b3024ea466f1d5d98c0104b3e8b7e27fa2
            sha256sum -c screen-translator-v1.1.0-release.apk.sha256
            ```

            ## Requirements

            - Android 12+ (API 31), ~150 MB free storage, no Google account required
              (ML Kit translation is on-device after the one-time model download).

            ## Verification done by CI

            - `apksigner verify --print-certs --verbose` → `Verifies`, v3=true, signer
              DN contains `CN=Screen Translator Release`, cert SHA-256 matches pinned
              baseline `a0b5e5…7fa2` (no key rotation).
            - Unit tests: 41 JVM tests (BoundingBox geometry, ScreenTextExtractor
              dedup/grouping, MlKitTranslationEngine regex + language-id filtering,
              LruCache behavior).
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
