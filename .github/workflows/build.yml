name: Build and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 platforms;android-31'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: screen-translator-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: screen-translator-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Screen Translator v1.0.${{ github.run_number }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          body: |
            # Screen Translator — Android APK

            Built from commit `${{ github.sha }}` on `${{ github.event.head_commit.timestamp || 'push' }}`.

            ## What's in this release

            - **`app-release.apk`** — signed with the debug keystore (per `app/build.gradle.kts`
              `release { signingConfig = signingConfigs.getByName("debug") }`) so it installs
              via `adb install` or by tapping the file. ~110 MB (ML Kit translate + language-id
              native libs bundled for all 4 ABIs).
            - **`app-debug.apk`** — debug variant, ~127 MB.

            ## Install

            1. Download `app-release.apk` to your Android phone.
            2. Tap to install. Accept **"Unknown sources"** for the file manager / browser.
            3. **Android 13+ sideload extra step:** long-press the app icon → App Info →
               three-dot menu → **"Allow restricted settings"**. This unblocks the
               accessibility permission that Android 13 hides for sideloaded APKs.
            4. Open **Settings → Accessibility → Screen Translator → enable**.
            5. Open the app → tap **Download model** (German → English, ~30 MB on-device).
            6. Pull down the Quick Settings shade twice → edit → drag the **"Translate Screen"**
               tile into the active row.
            7. Open any German app (DHL, banking, news) → tap the tile → German text on screen
               is overlaid with English translations. Tap the **X** button (top-right) or
               scroll/switch apps to dismiss.

            ## Requirements

            - Android 12+ (API 31)
            - ~150 MB free storage (APK + ML Kit model)
            - No Google account / Play Services login required (ML Kit is on-device)

            ## Verification

            Unit tests (`./gradlew :app:testDebugUnitTest`) run on every push:
            41 tests covering `BoundingBox` geometry, `ScreenTextExtractor` dedup/grouping,
            `MlKitTranslationEngine` regex + language-id filtering, and `LruCache` behavior.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
