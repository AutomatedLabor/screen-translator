name: Build, Sign and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Prevent two concurrent release builds from racing (Council P0-2).
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper jar
        uses: gradle/wrapper-validation-action@v3

      - name: "Scan for leaked secrets (gitleaks, advisory)"
        # Advisory for now (continue-on-error) so a false positive on the public cert
        # SHA-256 fingerprint doesn't block the build. Tighten to fail-closed once
        # confirmed clean across a few runs. (Council P1-4 / supply-chain.)
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 platforms;android-31'

      - name: Put build-tools (apksigner, aapt) on PATH
        run: |
          set -euo pipefail
          BT="$(ls -d "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/build-tools/"* | sort -V | tail -1)"
          echo "build-tools dir: $BT"
          echo "$BT" >> "$GITHUB_PATH"

      - name: "Decode release keystore (fail-closed)"
        env:
          TRANSLATOR_KEYSTORE_BASE64: ${{ secrets.TRANSLATOR_KEYSTORE_BASE64 }}
          TRANSLATOR_KEYSTORE_PASSWORD: ${{ secrets.TRANSLATOR_KEYSTORE_PASSWORD }}
          TRANSLATOR_KEY_ALIAS: ${{ secrets.TRANSLATOR_KEY_ALIAS }}
          TRANSLATOR_KEY_PASSWORD: ${{ secrets.TRANSLATOR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TRANSLATOR_KEYSTORE_BASE64:-}" ]; then
            echo "::error::TRANSLATOR_KEYSTORE_BASE64 secret is not set; refusing to build."
            exit 1
          fi
          if [ -z "${TRANSLATOR_KEYSTORE_PASSWORD:-}" ] || [ -z "${TRANSLATOR_KEY_ALIAS:-}" ] || [ -z "${TRANSLATOR_KEY_PASSWORD:-}" ]; then
            echo "::error::One or more keystore secrets are empty; aborting."
            exit 1
          fi
          echo "${TRANSLATOR_KEYSTORE_BASE64}" | base64 -d > "$RUNNER_TEMP/translator-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/translator-release.jks"
            echo "storePassword=$TRANSLATOR_KEYSTORE_PASSWORD"
            echo "keyAlias=$TRANSLATOR_KEY_ALIAS"
            echo "keyPassword=$TRANSLATOR_KEY_PASSWORD"
          } > "$GITHUB_WORKSPACE/keystore.properties"
          echo "keystore staged (jks in RUNNER_TEMP, properties at repo root)."
          keytool -list -keystore "$RUNNER_TEMP/translator-release.jks" \
            -storepass "$TRANSLATOR_KEYSTORE_PASSWORD" -alias "$TRANSLATOR_KEY_ALIAS" >/dev/null 2>&1 \
            || { echo "::error::keystore/password/alias mismatch — check TRANSLATOR_KEYSTORE_* secrets"; exit 1; }
          echo "keystore smoke-check passed."

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Run lint (report, non-failing)
        continue-on-error: true
        run: ./gradlew :app:lintRelease --no-daemon --stacktrace

      - name: Build release APK (R8 + ABI splits)
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: "Zipalign + sign release APKs (v1+v2+v3 for Android 7+)"
        # In CI, AGP leaves the release APK unsigned (signingConfig=null when CI=true) +
        # zipaligned. We sign it here with apksigner forcing v1+v2+v3. v1 is REQUIRED for
        # Android 7-8 (API 24-27, which support only v1+v2 — v3-only APKs fail to install).
        # v1 also makes `keytool -printcert -jarfile` report the signer. Signing from
        # unsigned (not re-signing) is the only reliable way to get v1 — apksigner sign on
        # an already-signed APK does not add v1. (v1.4.0: minSdk 24 -> Android 7+.)
        env:
          TRANSLATOR_KEYSTORE_PASSWORD: ${{ secrets.TRANSLATOR_KEYSTORE_PASSWORD }}
          TRANSLATOR_KEY_ALIAS: ${{ secrets.TRANSLATOR_KEY_ALIAS }}
          TRANSLATOR_KEY_PASSWORD: ${{ secrets.TRANSLATOR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          REL="app/build/outputs/apk/release"
          KS="$RUNNER_TEMP/translator-release.jks"
          for APK in "$REL"/*.apk; do
            NAME="$(basename "$APK")"
            echo "=== zipalign + v1+v2+v3 sign $NAME ==="
            # Re-zipalign (idempotent on AGP's already-aligned output) — required for v1;
            # apksigner sign checks alignment + fails if misaligned.
            zipalign -f 4 "$APK" "$APK.aligned"
            mv "$APK.aligned" "$APK"
            apksigner sign \
              --ks "$KS" \
              --ks-pass "pass:$TRANSLATOR_KEYSTORE_PASSWORD" \
              --ks-key-alias "$TRANSLATOR_KEY_ALIAS" \
              --key-pass "pass:$TRANSLATOR_KEY_PASSWORD" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              "$APK"
            echo "signed $NAME (v1+v2+v3)"
          done

      - name: "Verify release APK signing (fail-closed, every variant)"
        run: |
          set -euo pipefail
          shopt -s nullglob
          REL="app/build/outputs/apk/release"
          echo "=== release APK variants found ==="
          ls -lh "$REL"/*.apk
          APK_COUNT=$(ls "$REL"/*.apk 2>/dev/null | wc -l)
          [ "$APK_COUNT" -gt 0 ] || { echo "::error::no release APKs found at $REL"; exit 1; }
          for APK in "$REL"/*.apk; do
            NAME="$(basename "$APK" .apk)"
            echo "=== verifying $NAME ==="
            apksigner verify --print-certs --verbose "$APK" | tee "apksigner-verify-$NAME.txt"
            grep -q "^Verifies$" "apksigner-verify-$NAME.txt" || { echo "::error::$NAME NOT Verifies"; exit 1; }
            grep -q "Verified using v1 scheme (JAR signing): true" "apksigner-verify-$NAME.txt" || { echo "::error::$NAME v1 not verified (Android 7-8 + keytool need it)"; exit 1; }
            grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" "apksigner-verify-$NAME.txt" || { echo "::error::$NAME v2 not verified (Android 7+ needs it)"; exit 1; }
            grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" "apksigner-verify-$NAME.txt" || { echo "::error::$NAME v3 not verified"; exit 1; }
            grep -q "CN=Screen Translator Release" "apksigner-verify-$NAME.txt" || { echo "::error::$NAME wrong DN"; exit 1; }
            if grep -q "CN=Android Debug" "apksigner-verify-$NAME.txt"; then echo "::error::$NAME debug key"; exit 1; fi
            ACTUAL="$(grep -E 'certificate SHA-256 digest:' "apksigner-verify-$NAME.txt" | sed -E 's/.*certificate SHA-256 digest: ([a-f0-9]+).*/\1/' | head -1)"
            EXPECTED="a0b5e5f35ee134d2816a24cc467297b3024ea466f1d5d98c0104b3e8b7e27fa2"
            [ -n "$ACTUAL" ] || { echo "::error::$NAME could not parse cert SHA-256"; exit 1; }
            [ "$ACTUAL" = "$EXPECTED" ] || { echo "::error::$NAME cert SHA-256 mismatch (expected $EXPECTED got $ACTUAL) — KEY ROTATION?"; exit 1; }
            echo "OK: $NAME — Verifies, v1+v2+v3, DN=Screen Translator Release, cert matches baseline."
          done
          # Concatenate every variant's verify output into one release artifact.
          cat apksigner-verify-*.txt > apksigner-verify.txt
          echo "::notice::All $APK_COUNT release variant(s) signing-verified."

      - name: "Generate SHA-256 sidecars + stage release assets"
        run: |
          set -euo pipefail
          shopt -s nullglob
          REL="app/build/outputs/apk/release"
          STAGE="$GITHUB_WORKSPACE"
          for APK in "$REL"/*.apk; do
            NAME="$(basename "$APK" .apk)"
            case "$NAME" in
              *arm64-v8a*) ASSET="screen-translator-v1.4.0-arm64-v8a-release" ;;
              *universal*) ASSET="screen-translator-v1.4.0-universal-release" ;;
              *)           ASSET="screen-translator-v1.4.0-release" ;;
            esac
            ( cd "$REL" && sha256sum "$(basename "$APK")" > "$ASSET.apk.sha256" )
            cp "$APK" "$STAGE/$ASSET.apk"
            cp "$REL/$ASSET.apk.sha256" "$STAGE/$ASSET.apk.sha256"
            echo "staged $ASSET.apk ($(wc -c < "$STAGE/$ASSET.apk") bytes)  sha256: $(awk '{print $1}' "$STAGE/$ASSET.apk.sha256")"
          done
          # Badging from the arm64 variant (primary); fall back to universal.
          ARM="$STAGE/screen-translator-v1.4.0-arm64-v8a-release.apk"
          [ -f "$ARM" ] || ARM="$STAGE/screen-translator-v1.4.0-universal-release.apk"
          aapt dump badging "$ARM" | head -25 | tee badging.txt

      - name: Upload release APKs artifact
        uses: actions/upload-artifact@v4
        with:
          name: screen-translator-release-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk.sha256
            apksigner-verify-*.txt
            apksigner-verify.txt
            badging.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: screen-translator-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          name: Screen Translator v1.4.0 (Android 7+ support + v1+v2+v3 signing)
          files: |
            screen-translator-v1.4.0-arm64-v8a-release.apk
            screen-translator-v1.4.0-arm64-v8a-release.apk.sha256
            screen-translator-v1.4.0-universal-release.apk
            screen-translator-v1.4.0-universal-release.apk.sha256
            apksigner-verify.txt
            badging.txt
          body: |
            # Screen Translator v1.4.0 — Android 7+ support (minSdk 24) + v1+v2+v3 signing

            Built from commit `${{ github.sha }}`.

            ## What changed in v1.4.0

            - **Android 7+ support (minSdk 24).** The app now installs on Android 7.0
              (API 24) and above — previously required Android 12 (API 31), which caused
              "parsing error" / "There was a problem parsing the package" on Android 11
              and below. Every API 26/28/30 call site is now version-guarded:
              `TileService.requestListeningState` (API 28), `unlockAndRun`/`isLocked`
              (API 26), `AccessibilityNodeInfo.hintText` (API 26),
              `LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS` (API 28),
              `GLOBAL_ACTION_DISMISS_NOTIFICATION_SHADE` (API 30). On Android 7-10 the
              shade doesn't auto-collapse (the action is API 30) — the user dismisses it
              manually and the overlay appears.
            - **v1+v2+v3 APK signing (forced).** v3-only APKs fail to install on Android
              7-8 (API 24-27, which support only v1+v2). CI now RE-SIGNS each release
              variant with `apksigner sign --v1-signing-enabled true --v2-signing-enabled
              true --v3-signing-enabled true` and asserts all three schemes = true. v1
              also means `keytool -printcert -jarfile` reports the signer (no more
              false "Not a signed jar file").
            - versionCode 4 → 5, versionName 1.3.0 → 1.4.0.

            ## What changed in v1.3.0

            - **Two APK variants (ABI splits).** The release now ships as **arm64-v8a**
              (~40 MB, for any 64-bit ARM phone — ~99% of devices since 2017) AND
              **universal** (~107 MB, smaller with R8 — for 32-bit ARM / x86 emulators /
              rare x86 devices). Install arm64-v8a unless install fails with
              `INSTALL_FAILED_NO_MATCHING_ABIS` (then use universal).
            - **Target language picker.** No longer hardcoded German→English. Pick the
              target in the app: German → {English, Urdu, French, Spanish, Italian,
              Portuguese, Russian, Arabic, Turkish, Hindi, Chinese, Japanese}. Persisted
              to SharedPreferences; the Quick Settings tile picks up the change live
              (the service recreates its engine) — no need to re-enable accessibility.
            - **R8 minification + resource shrinking** on release — smaller APK +
              library-code obfuscation (harder to reverse-engineer). Generous keep rules
              for the app's classes + ML Kit + GMS keep it safe.
            - **Security hardening.** `usesCleartextTraffic=false` +
              `network_security_config.xml` (block cleartext app-wide) +
              `data_extraction_rules.xml` (exclude every domain from backup/transfer,
              belt-and-suspenders on `allowBackup=false`).
            - **Debug-only fix:** `FlagSecureTestActivity` moved from the androidTest
              sourceset to the debug sourceset (was a dangling exported activity in the
              debug APK).
            - **CI hardening:** gitleaks secret scan (advisory) + `lintRelease` report.
            - versionCode 3 → 4, versionName 1.2.0 → 1.3.0.

            ## Which APK to install

            | APK | Size | Install on |
            |---|---|---|
            | `screen-translator-v1.4.0-arm64-v8a-release.apk` | ~22 MB | **Any phone from ~2017** (Pixel, Samsung, OnePlus, Xiaomi, etc. — 64-bit ARM). Try this first. |
            | `screen-translator-v1.4.0-universal-release.apk` | ~72 MB | 32-bit ARM phones (pre-2017), x86 emulators, rare x86 devices. Fallback. |

            ## Install

            1. **If you have v1.0.0 or v1.0.1 installed, uninstall it first** (the signing
               key changed in v1.1.0). **v1.1.0+ users can update in place to v1.4.0** (same
               signing key, cert SHA-256 `a0b5e5…7fa2`).
            2. Download the arm64-v8a APK (or universal if arm64 fails) to your phone.
            3. Tap to install. Accept **"Unknown sources"**.
            4. **Android 13+:** long-press app icon → App Info → ⋮ → **"Allow restricted settings"**.
            5. Settings → Accessibility → Screen Translator → enable.
            6. Open the app → pick a **target language** → tap **Download model**.
            7. Pull down the Quick Settings shade twice → edit → drag the **"Translate Screen"** tile in.
            8. Open any German app → tap the tile → German text is overlaid with your target language.

            ## How to verify the APK is signed

            Use **`apksigner verify`** for the canonical check (v1.4.0 APKs are signed
            with all three schemes, so `keytool -printcert -jarfile` also works now).
            See `apksigner-verify.txt` for CI's proof.

            ```
            apksigner verify --print-certs --verbose screen-translator-v1.4.0-arm64-v8a-release.apk
            # expect: Verifies, v1=true, v2=true, v3=true,
            #         Signer #1 certificate DN: CN=Screen Translator Release, O=AutomatedLabor, C=US
            #         Signer #1 certificate SHA-256 digest: a0b5e5f35ee134d2816a24cc467297b3024ea466f1d5d98c0104b3e8b7e27fa2
            sha256sum -c screen-translator-v1.4.0-arm64-v8a-release.apk.sha256
            ```

            ## Verification done by CI

            - `apksigner verify` on **every** release variant → `Verifies`, **v1+v2+v3=true**
              (Android 7+ installable), DN contains `CN=Screen Translator Release`, cert
              SHA-256 matches pinned baseline `a0b5e5…7fa2` (no key rotation), debug key
              explicitly rejected.
            - Unit tests + lint run on every push.

            ## Requirements

            - **Android 7.0+ (API 24)**, ~60 MB free storage (arm64 APK + ML Kit model), no Google account.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
